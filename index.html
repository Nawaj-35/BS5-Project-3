<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Bootstrap Project-3</title>
</head>
<body>

                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Phone</th>
                        <th scope="col">Brand</th>
                        <th scope="col">Price</th>
                        <th scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Galaxy A15</td>
                        <td>Samsung</td>

                        <td class="text-success">In stock</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>iPhone 13</td>
                        <td>Apple</td>
                        <td>$520</td>
                        <td class="text-success">In stock</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Redmi Note 12</td>
                        <td>Xiaomi</td>
                        <td>$210</td>
                        <td class="text-danger">Sold out</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Xperia 10</td>
                        <td>Sony</td>
                        <td>$300</td>
                        <td class="text-warning">Few left</td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>Pixel 7</td>
                        <td>Google</td>
                        <td>$450</td>
                        <td class="text-danger">Sold out</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <p class="text-muted text-end small">Updated: October, 2026</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
